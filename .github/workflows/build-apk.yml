name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ دریافت سورس کد
      - uses: actions/checkout@v4

      # 2️⃣ نصب Java
      - uses: actions/setup-java@v5.1.0
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ کش Gradle
      - name: Cache Gradle
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 4️⃣ نصب Gradle (اختیاری اگر gradlew دارید)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.0.0

      # 5️⃣ دادن اجازه اجرایی به gradlew
      - name: Gradle Permission
        run: chmod +x EpsilonVpn/gradlew

      # 6️⃣ ساخت Debug APK
      - name: Build Debug APK
        working-directory: ./EpsilonVpn
        run: bash ./gradlew assembleDebug

      # 7️⃣ ساخت Release APK
      - name: Build Release APK
        working-directory: ./EpsilonVpn
        run: bash ./gradlew assembleRelease

      # 8️⃣ آپلود Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: EpsilonVPN-debug.apk
          path: ./EpsilonVpn/app/build/outputs/apk/debug/app-debug.apk

      # 9️⃣ آپلود Release APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: EpsilonVPN-release.apk
          path: ./EpsilonVpn/app/build/outputs/apk/release/app-release.apk
