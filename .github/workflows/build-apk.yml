name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ دریافت سورس کد
    - uses: actions/checkout@v4

    # 2️⃣ نصب Java
    - uses: actions/setup-java@v5.1.0
      with:
        distribution: temurin
        java-version: 17

    # 3️⃣ کش Gradle
    - name: Cache Gradle
      uses: actions/cache@v4.3.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper/
        key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

    # 4️⃣ دادن اجازه اجرایی به gradlew و ساخت APK
    - name: Build APK
      working-directory: EpsilonVpn       # <-- ریشه پروژه
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    # 5️⃣ آپلود APK ساخته شده
    - name: Upload APK
      uses: actions/upload-artifact@v5.0.0
      with:
        name: EpsilonVPN-debug.apk
        path: EpsilonVpn/app/build/outputs
