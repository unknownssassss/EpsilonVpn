name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.0.0

      - name: Gradle Permission
        run: chmod +x EpsilonVpn/gradlew

      - name: Build Debug APK
        working-directory: ./EpsilonVpn
        run: env -u MSYS bash ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./EpsilonVpn
        run: env -u MSYS bash ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v5
        with:
          name: EpsilonVPN-debug.apk
          path: ./EpsilonVpn/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v5
        with:
          name: EpsilonVPN-release.apk
          path: ./EpsilonVpn/app/build/outputs/apk/release/app-release.apk
